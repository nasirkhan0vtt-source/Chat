<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickChat - Anonymous Realtime Chat with Calls</title>
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PeerJS for WebRTC Audio/Video Calls -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #090d16 50%, #020617 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .orb-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.25);
            filter: blur(90px);
            border-radius: 50%;
            top: 10%;
            left: 15%;
            pointer-events: none;
        }

        .orb-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(236, 72, 153, 0.2);
            filter: blur(100px);
            border-radius: 50%;
            bottom: 10%;
            right: 15%;
            pointer-events: none;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            z-index: 10;
            position: relative;
            overflow: hidden;
        }

        /* JOIN SCREEN */
        .join-screen {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .app-logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .join-screen h2 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .join-screen p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        /* CHAT SCREEN */
        .chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 12px 16px;
            background: rgba(2, 6, 23, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info h3 {
            font-size: 14px;
            color: #f8fafc;
        }

        .user-info p {
            font-size: 11px;
            color: #10b981;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg-incoming {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg-outgoing {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg-author {
            font-size: 10px;
            opacity: 0.7;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .msg-media {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 4px;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: rgba(2, 6, 23, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 13px;
        }

        .send-btn {
            background: #8b5cf6;
            border: none;
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* MODALS */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #qrcode {
            margin: 15px 0;
            padding: 10px;
            background: white;
            border-radius: 12px;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* CALL OVERLAY */
        .call-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
        }

        .video-grid {
            width: 100%;
            height: 70%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            border-radius: 16px;
            overflow: hidden;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #localVideo {
            width: 100px;
            height: 140px;
            position: absolute;
            bottom: 10px;
            right: 10px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            object-fit: cover;
            background: #000;
        }

        .call-controls {
            display: flex;
            gap: 20px;
        }

        .end-call-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="chat-container">
        <!-- JOIN SCREEN -->
        <div class="join-screen" id="joinScreen">
            <div class="app-logo">⚡</div>
            <h2>QuickChat</h2>
            <p>No Login • No Email • Direct Chat & Calls</p>

            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Enter your username...">
            </div>
            
            <button class="btn-primary" onclick="startChat()">Start Chatting 🚀</button>
        </div>

        <!-- MAIN CHAT SCREEN -->
        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <div class="user-info">
                    <h3 id="displayUsername">User</h3>
                    <p>🟢 Online Room</p>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="startCall('audio')" title="Voice Call">📞</button>
                    <button class="icon-btn" onclick="startCall('video')" title="Video Call">📹</button>
                    <button class="icon-btn" onclick="showQRModal()" title="Share QR">📱</button>
                </div>
            </div>

            <div class="chat-messages" id="messagesBox"></div>

            <div class="chat-input-area">
                <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(event)">
                <button class="icon-btn" onclick="document.getElementById('mediaInput').click()" title="Attach Photo/Video">📎</button>
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- QR MODAL -->
        <div class="modal" id="qrModal">
            <div class="modal-content">
                <h3 style="font-size:16px;">Scan to Join</h3>
                <p style="font-size:12px; color:#94a3b8; margin-top:4px;">Scan code to join room</p>
                <div id="qrcode"></div>
                <button class="close-btn" onclick="closeQRModal()">Close</button>
            </div>
        </div>

        <!-- CALL OVERLAY -->
        <div class="call-modal" id="callModal">
            <h3 id="callStatusTitle">Calling...</h3>
            
            <div class="video-grid">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>

            <div class="call-controls">
                <button class="end-call-btn" onclick="endCall()">End Call 📵</button>
            </div>
        </div>
    </div>

    <script>
        // ✅ ऑटोमैटिक डोमेन/IP डिटेक्ट करेगा (पब्लिश होने पर भी अपने आप काम करेगा)
        const socket = io(window.location.origin); 

        let username = "";
        let roomId = "";
        let peer = null;
        let localStream = null;
        let currentCall = null;

        const urlParams = new URLSearchParams(window.location.search);
        const urlRoomId = urlParams.get('room');

        function startChat() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) {
                alert("Please enter a username!");
                return;
            }

            username = input;
            roomId = urlRoomId || "room_" + Math.random().toString(36).substring(2, 8);

            document.getElementById('displayUsername').innerText = username;
            document.getElementById('joinScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';

            peer = new Peer();

            peer.on('open', (id) => {
                socket.emit('join-room', { username, roomId, peerId: id });
            });

            peer.on('call', async (call) => {
                const answerCall = confirm("Incoming Call! Do you want to accept?");
                if (answerCall) {
                    currentCall = call;
                    document.getElementById('callModal').style.display = 'flex';
                    document.getElementById('callStatusTitle').innerText = "In Call";

                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('localVideo').srcObject = localStream;

                    call.answer(localStream);
                    call.on('stream', (remoteStream) => {
                        document.getElementById('remoteVideo').srcObject = remoteStream;
                    });
                }
            });
        }

        let targetPeerId = null;
        socket.on('user-connected', (peerId) => {
            targetPeerId = peerId;
        });

        async function startCall(type) {
            if (!targetPeerId) {
                alert("Waiting for a friend to join the room before calling!");
                return;
            }

            try {
                const constraints = type === 'video' ? { video: true, audio: true } : { video: false, audio: true };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('callModal').style.display = 'flex';
                document.getElementById('callStatusTitle').innerText = type === 'video' ? "Video Calling..." : "Voice Calling...";

                const call = peer.call(targetPeerId, localStream);
                currentCall = call;

                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('callStatusTitle').innerText = "Connected";
                });
            } catch (err) {
                alert("Camera/Microphone permission denied or unsupported.");
                console.error(err);
            }
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('callModal').style.display = 'none';
        }

        socket.on('receive-message', (data) => {
            appendMessage(data.username, data.message, data.mediaType, data.mediaData, data.username === username ? 'outgoing' : 'incoming');
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (message) {
                socket.emit('send-message', { roomId, username, message, mediaType: 'text', mediaData: null });
                input.value = '';
            }
        }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const mediaType = file.type.startsWith('image/') ? 'image' : (file.type.startsWith('video/') ? 'video' : null);

            if (!mediaType) {
                alert('Please select an image or video!');
                return;
            }

            reader.onload = function(e) {
                socket.emit('send-message', { roomId, username, message: '', mediaType: mediaType, mediaData: e.target.result });
            };

            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(sender, text, mediaType, mediaData, type) {
            const box = document.getElementById('messagesBox');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', type === 'outgoing' ? 'msg-outgoing' : 'msg-incoming');

            let contentHTML = type === 'incoming' ? `<div class="msg-author">${sender}</div>` : '';

            if (mediaType === 'image') {
                contentHTML += `<img src="${mediaData}" class="msg-media" />`;
            } else if (mediaType === 'video') {
                contentHTML += `<video src="${mediaData}" class="msg-media" controls></video>`;
            } else if (text) {
                contentHTML += text;
            }

            msgDiv.innerHTML = contentHTML;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        // ✅ QR कोड अब डायनामिक URL का सही लिंक बनाएगा
        function showQRModal() {
            const modal = document.getElementById('qrModal');
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ""; 

            // वर्तमान लाइव वेबसाइट या IP को अपने आप उठाएगा
            const joinURL = `${window.location.protocol}//${window.location.host}${window.location.pathname}?room=${roomId}`;

            new QRCode(qrContainer, { text: joinURL, width: 180, height: 180 });
            modal.style.display = 'flex';
        }

        function closeQRModal() {
            document.getElementById('qrModal').style.display = 'none';
        }
    </script>
</body>
</html>
